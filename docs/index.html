<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mini Puzzle</title>
    <meta name="description" content="A client-only jigsaw puzzle from any image file." />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: #0a0e16;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      .controls {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        padding: 10px;
        border: 1px solid rgba(96, 121, 242, 0.25);
        border-radius: 8px;
        background: rgba(10, 14, 22, 0.72);
        color: #cfd6e6;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        user-select: none;
        backdrop-filter: blur(4px);
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .controls:hover,
      .controls:focus-within {
        opacity: 1;
      }

      .controls__body {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        justify-items: start;
        gap: 8px 10px;
      }

      .controls__field {
        display: contents;
      }

      .controls__control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .controls__key {
        opacity: 0.6;
      }

      .controls__value {
        opacity: 0.9;
        white-space: nowrap;
      }

      .controls select,
      .controls input[type='file'] {
        max-width: 180px;
        color: inherit;
        font: inherit;
      }

      .controls button {
        padding: 3px 8px;
        border: 1px solid rgba(96, 121, 242, 0.3);
        border-radius: 6px;
        background: rgba(96, 121, 242, 0.12);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .controls button:hover {
        background: rgba(96, 121, 242, 0.22);
      }

      .controls input[type='checkbox'] {
        accent-color: #6079f2;
      }

      .controls--solved {
        border-color: rgba(96, 121, 242, 0.55);
      }

      .controls--solved .controls__value {
        color: #8fb0ff;
      }
    </style>

    <canvas id="canvas"></canvas>

    <div id="controls" class="controls">
      <div class="controls__body">
        <div class="controls__field">
          <span class="controls__key">image:</span>
          <div class="controls__control">
            <input id="controls-file" type="file" accept="image/*" />
          </div>
        </div>

          <div class="controls__control">

              <option value="6x4">6 x 4</option>

              <option value="10x8">10 x 8</option>
            </select>
          </div>
        </div>

          <span class="controls__key">new:</span>
          <button id="controls-new" type="button">new game</button>
        </div>

        <div class="controls__field">
          <span class="controls__key">shuffle:</span>
          <button id="controls-shuffle" type="button">shuffle</button>
        </div>

        <div class="controls__field">
          <span class="controls__key">target:</span>
          <input id="controls-target" type="checkbox" aria-label="target" />
        </div>

        <div class="controls__field">
          <span class="controls__key">center:</span>
          <button id="controls-center" type="button">center</button>
        </div>

        <div class="controls__field">
          <span class="controls__key">fit:</span>
          <button id="controls-fit" type="button">fit</button>
        </div>

        <div class="controls__field">
          <span class="controls__key">fullscreen:</span>
          <button id="controls-fullscreen" type="button"></button>
        </div>

        <div class="controls__field">
          <span class="controls__key">hud:</span>
          <input id="controls-hud" type="checkbox" aria-label="hud" />
        </div>

        <div class="controls__field">
          <span class="controls__key">status:</span>
          <span id="controls-status" class="controls__value"></span>
        </div>
      </div>
    </div>

    
  </body>
</html>
